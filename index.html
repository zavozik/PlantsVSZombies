<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Помощник по уходу за растениями</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar__logo">Помощник по уходу за растениями</div>
  </header>

  <div class="layout">

    <aside class="sidebar">
      <nav class="sidebar__nav">
        <a href="#" class="sidebar__link sidebar__link--active" data-view="catalog">Справочник растений</a>
        <a href="#" class="sidebar__link" data-view="mylist">Мой список</a>
        <a href="#" class="sidebar__link" data-view="favorites">Избранное</a>
      </nav>
    </aside>

    <main class="content">
      <section class="view" id="view-catalog">
        <h1>Справочник растений</h1>
        <div class="plant-grid" id="plant-grid"></div>
      </section>

      <section class="view" id="view-mylist" hidden>
        <h1>Мой список</h1>
        <div class="my-list" id="my-list"></div>
      </section>

      <section class="view" id="view-favorites" hidden>
        <h1>Избранное</h1>
        <div class="plant-grid" id="favorites-grid"></div>
      </section>
    </main>

  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
